<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Skystore{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="d-flex flex-column min-vh-100">

{% include "menu.html" %}

<main class="container py-4 flex-grow-1">
    {% block content %}
    {% endblock %}
</main>

<footer class="border-top mt-4 py-4">
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6">
                <h5>Skystore</h5>
                <p class="text-muted">
                    Магазин плагинов и полезных программ.
                </p>
                <small class="text-muted">
                    &copy; {% now "Y" %} Skystore
                </small>
            </div>

            <div class="col-12 col-md-6">
                <h5>Навигация</h5>

                <ul class="list-unstyled">
                    <li>
                        <a href="{% url 'home' %}">
                            Каталог
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'contacts' %}">
                            Контакты
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'product_create' %}">
                            Добавить товар
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
