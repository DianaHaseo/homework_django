{% extends "base.html" %}

{% block content %}
    <div class="container">
        <h1 class="mb-4">Удаление продукта</h1>

        <p>
            Вы уверены, что хотите удалить продукт
            <strong>{{ product.name }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Да, удалить
            </button>

            <a href="{% url 'product_detail' product.pk %}" class="btn btn-secondary">
                Отмена
            </a>
        </form>
    </div>
{% endblock %}
